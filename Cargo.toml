[package]
name = "nist"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "nist"
path = "src/main.rs"

[features]
default = ["test-server"]
test-server = []

[dependencies]
portable-pty = "0.9.0"
libghostty-vt = { path = "crates/libghostty-vt" }
arboard = "3.6"
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tinyjson = "2.5"
sysinfo = "0.38"
image = "0.25"
base64 = "0.22"
directories = "6.0"
signal-hook = "0.4"
llm = { version = "1.3", default-features = false, features = ["openai"] }
sys-info = "0.9"
regex = "1"
cpal = "0.17"
reqwest = { version = "0.13", features = ["blocking", "multipart", "json"] }

# SDL3 for Linux (build from source with plutosvg and HarfBuzz support)
[target.'cfg(target_os = "linux")'.dependencies]
sdl3 = { version = "0.17.3", features = ["ttf", "build-from-source"] }
sdl3-ttf-sys = { version = "0.6", features = ["sdlttf-plutosvg", "sdlttf-harfbuzz", "build-from-source"] }

# SDL3 for macOS (build from source with plutosvg and HarfBuzz support)
[target.'cfg(target_os = "macos")'.dependencies]
sdl3 = { version = "0.17.3", features = ["ttf", "build-from-source"], default-features = false }
sdl3-ttf-sys = { version = "0.6", features = ["sdlttf-plutosvg", "sdlttf-harfbuzz", "build-from-source"] }

# SDL3 for Windows (use pre-built DLLs)
[target.'cfg(target_os = "windows")'.dependencies]
sdl3 = { version = "0.17.3", features = ["ttf"] }
sdl3-ttf-sys = { version = "0.6", features = ["sdlttf-plutosvg", "sdlttf-harfbuzz"] }

[build-dependencies]
chrono = "0.4"
